# Tiny Tapeout project information
project:
  title:        "Neural Spiking Detection"      # Project title
  author:       "Ryan John Sabra and Marcus Ho"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Detects neural spikes and outputs event signal <50ns enabling more efficient close looped feedback with medical devices and brain-computer interfaces."      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     40000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 340x160 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 3x4 or 4x4

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_rs2387_project"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "exponential_moving_average.v"
    - "spike_detector.v"
    - "tt_um_rs2387_project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "Sample bit 0 (LSB)"
  ui[1]: "Sample bit 1"
  ui[2]: "Sample bit 2"
  ui[3]: "Sample bit 3"
  ui[4]: "Sample bit 4"
  ui[5]: "Sample bit 5"
  ui[6]: "Sample bit 6"
  ui[7]: "Sample bit 7"

  # Outputs
  uo[0]: "Spike event output bit"
  uo[1]: ""
  uo[2]: ""
  uo[3]: ""
  uo[4]: ""
  uo[5]: ""
  uo[6]: ""
  uo[7]: ""

  # Bidirectional pins
  uio[0]: "Sample bit 8"
  uio[1]: "Sample bit 9"
  uio[2]: "Sample bit 10"
  uio[3]: "Sample bit 11"
  uio[4]: "Sample bit 12"
  uio[5]: "Sample bit 13"
  uio[6]: "Sample bit 14 (MSB)"
  uio[7]: "Sample valid bit"

# Do not change!
yaml_version: 6
